name: Build MarketBD Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build installable MarketBD.apk
        working-directory: android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="${{ github.workspace }}/android/app/release.keystore" \
              -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASS }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASS }}"
            cp app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/MarketBD.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/MarketBD.apk"
          fi

      - name: Upload MarketBD.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketBD-apk
          path: MarketBD.apk

      - name: Publish to latest-apk GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: MarketBD Android App (Latest APK)
          body: |
            অফিসিয়াল MarketBD.Net অ্যান্ড্রয়েড অ্যাপ (MarketBD.apk)।
            ডাউনলোড করে আপনার অ্যান্ড্রয়েড ফোনে ইনস্টল করুন।
          files: MarketBD.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
