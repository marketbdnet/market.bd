    <!-- Storage & Cache Resilience Script -->
    <script>
      (function() {
        try {
          // Unregister any old/broken service worker that intercepts network requests
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          }
          // Clear any stale CacheStorage (removes old cached HTML & chunks across deploys)
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            }).catch(function() {});
          }
          // Self-heal corrupted maintenance state in browser localStorage
          var maint = localStorage.getItem('marketbd_site_maintenance_v1');
          if (maint) {
            try {
              var parsed = JSON.parse(maint);
              if (parsed && (parsed.isMaintenance || parsed.isMasterLockdown)) {
                // If it was inadvertently saved as true locally, normalize it to false
                parsed.isMaintenance = false;
                parsed.isMasterLockdown = false;
                localStorage.setItem('marketbd_site_maintenance_v1', JSON.stringify(parsed));
              }
            } catch(e) {
              localStorage.removeItem('marketbd_site_maintenance_v1');
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Native ESM & Vite Dynamic Module Load Resilience -->
    <script>
      (function() {
        function handleChunkError(err) {
          var msg = (err && (err.message || (err.reason && err.reason.message))) || String(err || '');
          if (
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1
          ) {
            var retryCount = parseInt(sessionStorage.getItem('marketbd_chunk_retry_count') || '0', 10);
            if (retryCount < 3) {
              sessionStorage.setItem('marketbd_chunk_retry_count', String(retryCount + 1));
              setTimeout(function() {
                window.location.reload();
              }, 500);
            }
          }
        }
        window.addEventListener('vite:preloadError', function(event) {
          event.preventDefault();
          window.location.reload();
        });
        window.addEventListener('unhandledrejection', function(event) {
          handleChunkError(event.reason);
        });
        window.addEventListener('error', function(event) {
          handleChunkError(event.error);
        });
      })();
    </script>
