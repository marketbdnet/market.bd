    <!-- Self-Heal Bloated Legacy Cache & Corrupted Local State (One-time instant cleanup on mobile WebView) -->
    <script>
      (function() {
        try {
          // Purge legacy oversized 4.5MB full-catalog localStorage key so Android WebView never stalls on JSON parse/quota
          if (localStorage.getItem('marketbd_products_v4')) {
            localStorage.removeItem('marketbd_products_v4');
          }
          var maint = localStorage.getItem('marketbd_site_maintenance_v1');
          if (maint) {
            try {
              var parsed = JSON.parse(maint);
              if (parsed && (parsed.isMaintenance || parsed.isMasterLockdown)) {
                parsed.isMaintenance = false;
                parsed.isMasterLockdown = false;
                localStorage.setItem('marketbd_site_maintenance_v1', JSON.stringify(parsed));
              }
            } catch(e) {
              localStorage.removeItem('marketbd_site_maintenance_v1');
            }
          }
          if (localStorage.getItem('marketbd_logo_migrated_v3') !== '1') {
            localStorage.setItem('marketbd_logo_migrated_v3', '1');
            localStorage.removeItem('marketbd_custom_logo');
          }
          if (localStorage.getItem('marketbd_sw_v9_flushed') !== '1') {
            localStorage.setItem('marketbd_sw_v9_flushed', '1');
            try {
              var rawClk = localStorage.getItem('marketbd_clock_settings_v1');
              if (rawClk) {
                var parsedClk = JSON.parse(rawClk);
                if (!parsedClk || !parsedClk.clockVersion || parsedClk.clockVersion < 2) {
                  localStorage.removeItem('marketbd_clock_settings_v1');
                }
              }
            } catch(e) {}
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) {
                  if (n !== 'marketbd-app-v9') caches.delete(n);
                });
              });
            }
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.update(); });
              });
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Safe Dynamic Module Recovery (Max 1 auto-reload per 15s, prevents infinite WebView reload loops) -->
    <script>
      (function() {
        function triggerSingleReload() {
          try {
            var now = Date.now();
            var last = parseInt(sessionStorage.getItem('marketbd_last_chunk_reload') || '0', 10);
            if (!last || now - last > 15000) {
              sessionStorage.setItem('marketbd_last_chunk_reload', String(now));
              window.location.reload();
            }
          } catch (e) {}
        }
        function handleChunkError(err) {
          var msg = (err && (err.message || (err.reason && err.reason.message))) || String(err || '');
          if (
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1
          ) {
            triggerSingleReload();
          }
        }
        window.addEventListener('vite:preloadError', function(event) {
          event.preventDefault();
          triggerSingleReload();
        });
        window.addEventListener('unhandledrejection', function(event) {
          handleChunkError(event.reason);
        });
      })();
    </script>
